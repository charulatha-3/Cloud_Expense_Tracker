
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudSpend - Expense Tracker</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f4f7fb;
    color: #172033;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 235px;
    height: 100vh;
    background: #102a43;
    color: white;
    padding: 25px 18px;
}

.logo {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 35px;
}

.logo span {
    color: #38bdf8;
}

.menu button {
    width: 100%;
    border: none;
    background: transparent;
    color: #cbd5e1;
    padding: 13px 15px;
    margin: 5px 0;
    text-align: left;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
}

.menu button:hover,
.menu button.active {
    background: #0284c7;
    color: white;
}

/* MAIN */

.main {
    margin-left: 235px;
    padding: 30px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    color: #64748b;
    font-size: 13px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    background: white;
    padding: 8px 15px;
    border-radius: 30px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.avatar {
    width: 36px;
    height: 36px;
    background: #0284c7;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.stat-icon {
    font-size: 28px;
}

.stat h2 {
    margin-top: 8px;
    font-size: 25px;
}

.stat p {
    color: #64748b;
    font-size: 13px;
}

/* ACTION BAR */

.action-bar {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
}

.search {
    flex: 1;
}

.search input {
    width: 100%;
    padding: 14px 18px;
    border: none;
    background: white;
    border-radius: 10px;
    outline: none;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.primary {
    border: none;
    background: #0284c7;
    color: white;
    padding: 12px 20px;
    border-radius: 9px;
    cursor: pointer;
}

.primary:hover {
    background: #0369a1;
}

/* CONTENT */

.content-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 22px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.card-title h2 {
    font-size: 19px;
}

/* TRANSACTIONS */

.transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-left {
    display: flex;
    align-items: center;
    gap: 13px;
}

.transaction-icon {
    width: 43px;
    height: 43px;
    border-radius: 11px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e0f2fe;
    font-size: 20px;
}

.transaction h3 {
    font-size: 14px;
}

.transaction p {
    font-size: 11px;
    color: #64748b;
}

.amount {
    font-weight: 600;
}

.expense {
    color: #dc2626;
}

.income {
    color: #16a34a;
}

.transaction-actions {
    display: flex;
    gap: 6px;
    margin-left: 12px;
}

.transaction-actions button {
    border: none;
    padding: 7px 9px;
    border-radius: 6px;
    cursor: pointer;
}

.edit {
    background: #dbeafe;
    color: #1d4ed8;
}

.delete {
    background: #fee2e2;
    color: #dc2626;
}

/* CATEGORY */

.category-row {
    margin-bottom: 18px;
}

.category-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
}

.category-bar {
    height: 9px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
}

.category-progress {
    height: 100%;
    background: #0284c7;
    border-radius: 10px;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.65);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

.modal-box {
    width: 450px;
    max-width: 92%;
    background: white;
    padding: 28px;
    border-radius: 17px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.modal-box input,
.modal-box select {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.cancel {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #e2e8f0;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 35px;
    color: #64748b;
}

/* RESPONSIVE */

@media(max-width: 950px) {

    .sidebar {
        width: 190px;
    }

    .main {
        margin-left: 190px;
    }

    .content-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 650px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .action-bar {
        flex-direction: column;
    }

    .transaction {
        align-items: flex-start;
        gap: 10px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        ☁️ Cloud<span>Spend</span>
    </div>

    <div class="menu">

        <button class="active" onclick="showDashboard()">
            🏠 Dashboard
        </button>

        <button onclick="filterCategory('Food')">
            🍔 Food
        </button>

        <button onclick="filterCategory('Travel')">
            🚕 Travel
        </button>

        <button onclick="filterCategory('Education')">
            🎓 Education
        </button>

        <button onclick="filterCategory('Shopping')">
            🛒 Shopping
        </button>

        <button onclick="openModal()">
            ➕ Add Transaction
        </button>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="header">

        <div>
            <h1>CloudSpend</h1>
            <p>Track your income and expenses from one place ☁️</p>
        </div>

        <div class="profile">

            <div class="avatar">C</div>

            <span>Charu</span>

        </div>

    </header>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-icon">💰</div>

            <h2 id="balance">₹0</h2>

            <p>Current Balance</p>

        </div>


        <div class="stat">

            <div class="stat-icon">📤</div>

            <h2 id="totalExpense">₹0</h2>

            <p>Total Expenses</p>

        </div>


        <div class="stat">

            <div class="stat-icon">📥</div>

            <h2 id="totalIncome">₹0</h2>

            <p>Total Income</p>

        </div>

    </section>


    <!-- SEARCH -->

    <div class="action-bar">

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search transactions..."
                onkeyup="searchTransactions()"
            >

        </div>

        <button class="primary" onclick="openModal()">
            + Add Transaction
        </button>

    </div>


    <!-- CONTENT -->

    <div class="content-grid">


        <!-- TRANSACTIONS -->

        <section class="card">

            <div class="card-title">

                <h2>Recent Transactions</h2>

            </div>

            <div id="transactionList"></div>

        </section>


        <!-- CATEGORY ANALYSIS -->

        <section class="card">

            <div class="card-title">

                <h2>Expense Categories</h2>

            </div>

            <div id="categoryList"></div>

        </section>

    </div>

</main>


<!-- MODAL -->

<div class="modal" id="transactionModal">

    <div class="modal-box">

        <h2 id="modalTitle">➕ Add Transaction</h2>

        <input
            id="transactionName"
            placeholder="Transaction name"
        >

        <input
            id="transactionAmount"
            type="number"
            placeholder="Amount"
        >

        <select id="transactionType">

            <option value="">Select Type</option>

            <option value="expense">Expense</option>

            <option value="income">Income</option>

        </select>

        <select id="transactionCategory">

            <option value="">Select Category</option>

            <option>Food</option>

            <option>Travel</option>

            <option>Education</option>

            <option>Shopping</option>

            <option>Bills</option>

            <option>Other</option>

        </select>

        <input
            id="transactionDate"
            type="date"
        >

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeModal()">

                Cancel

            </button>

            <button
                class="primary"
                onclick="saveTransaction()">

                Save

            </button>

        </div>

    </div>

</div>


<script>

/*
    CLOUDSPEND EDUCATIONAL PROTOTYPE

    Data is stored in browser LocalStorage.
    AWS services can be connected later.
*/


let transactions =
    JSON.parse(
        localStorage.getItem("cloudSpendTransactions")
    ) || [

        {
            name: "College Canteen",
            amount: 120,
            type: "expense",
            category: "Food",
            date: "2026-10-01"
        },

        {
            name: "Bus Travel",
            amount: 80,
            type: "expense",
            category: "Travel",
            date: "2026-10-02"
        },

        {
            name: "Monthly Allowance",
            amount: 5000,
            type: "income",
            category: "Other",
            date: "2026-10-01"
        },

        {
            name: "Online Course",
            amount: 650,
            type: "expense",
            category: "Education",
            date: "2026-10-03"
        },

        {
            name: "College Supplies",
            amount: 450,
            type: "expense",
            category: "Shopping",
            date: "2026-10-04"
        }

    ];


let editIndex = -1;


/* DISPLAY TRANSACTIONS */

function displayTransactions(list = transactions) {

    const container =
        document.getElementById("transactionList");

    container.innerHTML = "";


    if (list.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No transactions found 🔍
            </div>
        `;

        updateDashboard();

        return;
    }


    list.forEach((item) => {

        const realIndex =
            transactions.indexOf(item);


        container.innerHTML += `

            <div class="transaction">

                <div class="transaction-left">

                    <div class="transaction-icon">
                        ${getIcon(item.category)}
                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(item.name)}
                        </h3>

                        <p>
                            ${item.category}
                            • ${formatDate(item.date)}
                        </p>

                    </div>

                </div>


                <div style="display:flex;align-items:center;">

                    <span class="amount ${
                        item.type === "income"
                        ? "income"
                        : "expense"
                    }">

                        ${
                            item.type === "income"
                            ? "+"
                            : "-"
                        }

                        ₹${Number(item.amount).toLocaleString("en-IN")}

                    </span>


                    <div class="transaction-actions">

                        <button
                            class="edit"
                            onclick="editTransaction(${realIndex})">

                            ✏️

                        </button>


                        <button
                            class="delete"
                            onclick="deleteTransaction(${realIndex})">

                            🗑️

                        </button>

                    </div>

                </div>

            </div>

        `;

    });


    updateDashboard();

}


/* ICONS */

function getIcon(category) {

    const icons = {

        Food: "🍔",

        Travel: "🚕",

        Education: "🎓",

        Shopping: "🛒",

        Bills: "💡",

        Other: "📌"

    };

    return icons[category] || "📌";

}


/* FORMAT DATE */

function formatDate(date) {

    if (!date) return "";

    const parts = date.split("-");

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* DASHBOARD */

function updateDashboard() {

    let income = 0;

    let expense = 0;


    transactions.forEach(item => {

        if (item.type === "income") {

            income += Number(item.amount);

        } else {

            expense += Number(item.amount);

        }

    });


    const balance = income - expense;


    document.getElementById("balance")
        .textContent =
        "₹" + balance.toLocaleString("en-IN");


    document.getElementById("totalIncome")
        .textContent =
        "₹" + income.toLocaleString("en-IN");


    document.getElementById("totalExpense")
        .textContent =
        "₹" + expense.toLocaleString("en-IN");


    displayCategories();

}


/* CATEGORY ANALYSIS */

function displayCategories() {

    const container =
        document.getElementById("categoryList");

    container.innerHTML = "";


    const categoryTotals = {};


    transactions.forEach(item => {

        if (item.type !== "expense") return;


        if (!categoryTotals[item.category]) {

            categoryTotals[item.category] = 0;

        }


        categoryTotals[item.category] +=
            Number(item.amount);

    });


    const values =
        Object.values(categoryTotals);


    const maximum =
        values.length
        ? Math.max(...values)
        : 1;


    Object.entries(categoryTotals)
        .forEach(([category, amount]) => {

            const percentage =
                Math.round((amount / maximum) * 100);


            container.innerHTML += `

                <div class="category-row">

                    <div class="category-head">

                        <span>
                            ${getIcon(category)}
                            ${category}
                        </span>

                        <strong>
                            ₹${amount.toLocaleString("en-IN")}
                        </strong>

                    </div>

                    <div class="category-bar">

                        <div
                            class="category-progress"
                            style="width:${percentage}%">
                        </div>

                    </div>

                </div>

            `;

        });


    if (Object.keys(categoryTotals).length === 0) {

        container.innerHTML = `
            <div class="empty">
                No expense data yet.
            </div>
        `;

    }

}


/* OPEN MODAL */

function openModal() {

    editIndex = -1;

    document.getElementById("modalTitle")
        .textContent = "➕ Add Transaction";

    clearForm();

    document.getElementById("transactionModal")
        .style.display = "flex";

}


/* CLOSE MODAL */

function closeModal() {

    document.getElementById("transactionModal")
        .style.display = "none";

    clearForm();

    editIndex = -1;

}


/* SAVE */

function saveTransaction() {

    const name =
        document.getElementById("transactionName")
        .value.trim();


    const amount =
        document.getElementById("transactionAmount")
        .value;


    const type =
        document.getElementById("transactionType")
        .value;


    const category =
        document.getElementById("transactionCategory")
        .value;


    const date =
        document.getElementById("transactionDate")
        .value;


    if (!name || !amount || !type || !category || !date) {

        alert("Please fill all fields.");

        return;

    }


    const transaction = {

        name: name,

        amount: Number(amount),

        type: type,

        category: category,

        date: date

    };


    if (editIndex === -1) {

        transactions.unshift(transaction);

    } else {

        transactions[editIndex] = transaction;

    }


    saveToStorage();

    closeModal();

    displayTransactions();

}


/* EDIT */

function editTransaction(index) {

    const item =
        transactions[index];


    editIndex = index;


    document.getElementById("modalTitle")
        .textContent = "✏️ Edit Transaction";


    document.getElementById("transactionName")
        .value = item.name;


    document.getElementById("transactionAmount")
        .value = item.amount;


    document.getElementById("transactionType")
        .value = item.type;


    document.getElementById("transactionCategory")
        .value = item.category;


    document.getElementById("transactionDate")
        .value = item.date;


    document.getElementById("transactionModal")
        .style.display = "flex";

}


/* DELETE */

function deleteTransaction(index) {

    if (!confirm("Delete this transaction?")) return;


    transactions.splice(index, 1);

    saveToStorage();

    displayTransactions();

}


/* SEARCH */

function searchTransactions() {

    const value =
        document.getElementById("searchInput")
        .value
        .toLowerCase();


    const filtered =
        transactions.filter(item =>

            item.name.toLowerCase().includes(value) ||

            item.category.toLowerCase().includes(value) ||

            item.type.toLowerCase().includes(value)

        );


    displayTransactions(filtered);

}


/* CATEGORY FILTER */

function filterCategory(category) {

    document.getElementById("searchInput")
        .value = category;


    const filtered =
        transactions.filter(item =>
            item.category === category
        );


    displayTransactions(filtered);

}


/* DASHBOARD */

function showDashboard() {

    document.getElementById("searchInput")
        .value = "";

    displayTransactions(transactions);

}


/* STORAGE */

function saveToStorage() {

    localStorage.setItem(
        "cloudSpendTransactions",
        JSON.stringify(transactions)
    );

}


/* CLEAR FORM */

function clearForm() {

    document.getElementById("transactionName")
        .value = "";

    document.getElementById("transactionAmount")
        .value = "";

    document.getElementById("transactionType")
        .value = "";

    document.getElementById("transactionCategory")
        .value = "";

    document.getElementById("transactionDate")
        .value = "";

}


/* ESCAPE HTML */

function escapeHTML(value) {

    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* INITIALIZE */

displayTransactions();

</script>

</body>
</html>
